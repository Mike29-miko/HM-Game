<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Roster Randomizer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="speed-lines"></div>
<div class="flash" id="flash-overlay"></div>
<div class="confetti-layer" id="confetti-layer"></div>
    <header>
        <h1>Challenge</h1>
        <div class="status-bar">
            Round: <span id="round-num">1</span>/5 | Pool Remaining: <span id="pool-count">5</span>
        </div>
        <button id="music-toggle" class="music-btn">🔇 Music</button>
    </header>

    <audio id="bg-music" src="audio/theme.mp3" loop preload="auto"></audio>

    <main>
        <!-- Display Stage -->
        <div class="stage">
            <div class="character-card">
                <img id="stage-img" class="character-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='130' viewBox='0 0 130 130'><rect width='100%' height='100%' fill='%2316181f'/><text x='50%' y='55%' font-size='40' fill='%238a8d9b' text-anchor='middle' dominant-baseline='middle'>?</text></svg>" alt="Selected Character">
                <div id="stage-name" class="character-name">PRESS START</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="start-btn" class="btn">Start Selection</button>
        </div>

        <!-- Roster Grid -->
        <div class="roster-title">Available Cards</div>
        <div class="grid" id="roster-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
